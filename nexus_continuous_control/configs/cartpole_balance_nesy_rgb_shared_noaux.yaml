# CartpoleBalance RGB with ONE SHARED CNN ENCODER and NO auxiliary loss.
#
# THE LOAD-BEARING ARM. It asks the one question the whole shared-encoder idea
# rests on:
#
#     Does sharing the encoder across the N skills fix the blind encoder ON ITS
#     OWN, WITHOUT the aux pixel->state supervision?
#
# The 2026-08-17 ablation found the in-loop pixel actor effectively blind: its
# output moved only 0.005-0.151% of the action range across completely different
# frames, and a constant action per skill scored BETTER than the trained actor.
# The fix shipped then was RGB_AUX_STATE_COEF -- a DENSE supervised
# "where is the pole in this picture?" loss. That works, but it is a crutch: it
# hands the encoder a privileged-state target that a real pixel agent would not
# have, so the "skills learned from pixels" claim is weakened.
#
# The hypothesis here is that the blindness was never about the KIND of signal,
# only its MAGNITUDE: with N private encoders each copy received just its 1/N
# share of the deterministic policy gradient through the privileged critic. One
# shared trunk gets the SUMMED gradient of all N heads. If that alone is enough,
# the aux crutch can be dropped entirely.
#
# Read the result as:
#   pixel_sensitivity climbs >> 0.01 and return matches the aux arm
#       -> sharing is sufficient; RGB_AUX_STATE_COEF is unnecessary and the
#          pixel claim is clean.
#   pixel_sensitivity stays ~0 (as in cartpole_balance_nesy_rgb.yaml)
#       -> the gradient magnitude was NOT the whole story; the dense aux signal
#          is doing the real work. Use cartpole_balance_nesy_rgb_shared.yaml.
#
# Compare against, with the SAME seed:
#   cartpole_balance_nesy_rgb.yaml         (unshared, no aux -- the blind baseline)
#   cartpole_balance_nesy_rgb_aux.yaml     (unshared, aux    -- the shipped fix)
#   cartpole_balance_nesy_rgb_shared.yaml  (shared,   aux    -- both levers)
#
# Watch train/rgb/pixel_sensitivity from update ~20: it is ~0 for a blind
# encoder. If it has not climbed well above 0.01 by ~50 updates, kill the run
# rather than waiting 45 minutes -- the answer is already "no".
ALG_NAME: nexus_ac_pqn
ENV_NAME: CartpoleBalance
PLAYGROUND_IMPL: warp
POLICY: cartpole_balance
META_POLICY_TYPE: nesy

# RGB extension
USE_RGB: true
RGB_EMBED_DIM: 128
RGB_EPISODE_LENGTH: 250
RGB_PROPRIO: none
RGB_AUGMENT: true
RGB_AUG_PAD: 4

# --- lever A ALONE ---
RGB_SHARED_ENCODER: true       # one CNN trunk, N small action heads
RGB_AUX_STATE_COEF: 0.0        # aux crutch OFF -- this is the point of this arm
RGB_MONITOR_SENSITIVITY: true  # log train/rgb/pixel_sensitivity every update
META_DECISION_INTERVAL: 4      # stop the meta compensating on every single step

TOTAL_TIMESTEPS: 2048000       # 128 envs x 64 steps x 250 updates
NUM_ENVS: 128
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 8
NUM_SEEDS: 1
SEED: 0

GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80

LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0

ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu

NOISE_START: 0.30
NOISE_FINISH: 0.02
NOISE_DECAY: 0.80
META_EPS_START: 1.0
META_EPS_FINISH: 0.02
META_EPS_DECAY: 0.60

NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.001
ACTOR_UPDATE_MODE: all_states

EVAL_AFTER_TRAIN: true
EVAL_NUM_ENVS: 64
EVAL_NUM_EPISODES: 128

PRINT_EVERY: 0
SAVE_PATH: null
