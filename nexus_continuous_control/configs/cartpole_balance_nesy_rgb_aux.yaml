# CartpoleBalance RGB with the fix for the "blind encoder" finding (2026-08-17).
#
# The ablation showed the in-loop pixel actor ignores its camera: freezing,
# scrambling or blanking the image left behaviour unchanged, and a constant
# action per skill scored BETTER (0.606 vs 0.514 upright). Open-loop probing
# confirmed the actor's output moves only 0.005-0.151% of the action range
# across completely different frames -- while still correlating with the pole
# angle (r=+0.90), i.e. the feature is there but ~1000x too weak to control.
#
# Three changes vs cartpole_balance_nesy_rgb.yaml, each targeting one cause:
#   1. RGB_AUX_STATE_COEF -- the CNN's only signal was the policy gradient
#      through the privileged critic (a whisper). This adds a DENSE supervised
#      "where is the pole in this picture?" loss on the encoder latent, the same
#      signal that lets the distillation arm reach r ~ 0.99 on identical inputs.
#   2. META_DECISION_INTERVAL -- the meta re-picked a skill EVERY step, so it
#      could solve cartpole alone and the actor was never forced to see.
#      Committing for 4 steps makes the actor carry control in between.
#   3. LR back to 3e-4 -- 1e-4 was chosen for stability, but the measured
#      failure is an encoder that does not move at all.
#
# Watch train/rgb/pixel_sensitivity during the run: it is ~0 for a blind
# encoder. If it does not climb well above 0.01 within ~50 updates, the fix is
# not working -- kill the run rather than waiting 45 minutes.
ALG_NAME: nexus_ac_pqn
ENV_NAME: CartpoleBalance
PLAYGROUND_IMPL: warp
POLICY: cartpole_balance
META_POLICY_TYPE: nesy

# RGB extension
USE_RGB: true
RGB_EMBED_DIM: 128
RGB_EPISODE_LENGTH: 250
RGB_PROPRIO: none
RGB_AUGMENT: true
RGB_AUG_PAD: 4

# --- the fix ---
RGB_AUX_STATE_COEF: 1.0        # dense pixel->state supervision on the CNN latent
RGB_MONITOR_SENSITIVITY: true  # log train/rgb/pixel_sensitivity every update
META_DECISION_INTERVAL: 4      # stop the meta compensating on every single step

TOTAL_TIMESTEPS: 2048000       # 128 envs x 64 steps x 250 updates
NUM_ENVS: 128
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 8
NUM_SEEDS: 1
SEED: 0

GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80

LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0

ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu

NOISE_START: 0.30
NOISE_FINISH: 0.02
NOISE_DECAY: 0.80
META_EPS_START: 1.0
META_EPS_FINISH: 0.02
META_EPS_DECAY: 0.60

NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.001
ACTOR_UPDATE_MODE: all_states

EVAL_AFTER_TRAIN: true
EVAL_NUM_ENVS: 64
EVAL_NUM_EPISODES: 128

PRINT_EVERY: 0
SAVE_PATH: null
