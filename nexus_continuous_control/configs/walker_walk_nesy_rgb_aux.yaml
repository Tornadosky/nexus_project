# WalkerWalk RGB with the fix that rescued CartpoleBalance (2026-08-18).
#
# The responsiveness probe found walker's in-loop actor SEES overall (63.9%
# median drop when the camera is corrupted), but only via ONE of its four
# skills (energy_efficient); the other three (stand_recover, walk_forward,
# stabilize_gait) output the exact same tanh-saturated action regardless of
# the image (verified: blank vs. stark-white frame produced bit-identical
# actions). Same root cause as the cartpole blindness: the encoder's only
# signal is the policy gradient through the privileged critic, which is too
# weak for some skills to ever learn to see.
#
# Same fix as cartpole_balance_nesy_rgb_aux.yaml, mirrored here:
#   1. RGB_AUX_STATE_COEF -- dense "where is the robot?" supervision on the
#      CNN latent (the same signal that lets distillation reach r ~ 0.99).
#   2. META_DECISION_INTERVAL -- stop the meta re-deciding every single step
#      so each skill actor is forced to carry control between decisions.
#   3. LR is already 0.0003 in the base walker config (the value we had to
#      raise cartpole TO), so no change needed there.
#
# Watch train/rgb/pixel_sensitivity per skill during training; expect the 3
# previously-saturated skills to climb off ~0 if the fix works, mirroring
# cartpole's cure.
ALG_NAME: nexus_ac_pqn
ENV_NAME: WalkerWalk
POLICY: walker_walk
META_POLICY_TYPE: nesy

# RGB extension
USE_RGB: true
RGB_EMBED_DIM: 128
RGB_EPISODE_LENGTH: 250
RGB_PROPRIO: none
RGB_AUGMENT: true
RGB_AUG_PAD: 4

# --- the fix ---
RGB_AUX_STATE_COEF: 1.0
RGB_MONITOR_SENSITIVITY: true
META_DECISION_INTERVAL: 4

# NUM_ENVS/TOTAL_TIMESTEPS are overridden by rgb_pixel_ablation.py's
# --num-envs/--updates flags; kept here only for direct (non-ablation) runs.
TOTAL_TIMESTEPS: 2048000       # 128 envs x 64 steps x 250 updates
NUM_ENVS: 128
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
NUM_SEEDS: 1
SEED: 0

GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80

LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0

ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu

NOISE_START: 0.35
NOISE_FINISH: 0.03
NOISE_DECAY: 0.80
META_EPS_START: 1.0
META_EPS_FINISH: 0.02
META_EPS_DECAY: 0.60

NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.0005
ACTOR_UPDATE_MODE: all_states

EVAL_AFTER_TRAIN: true
EVAL_NUM_ENVS: 64
EVAL_NUM_EPISODES: 128

PRINT_EVERY: 0
SAVE_PATH: null
