# WalkerWalk: the BLIND ANCHOR config plus RGB_SHARED_ENCODER, nothing else.
#
# walker_walk_nesy.yaml + RGB_SHARED_ENCODER: true. A strict ONE-FLAG test against the
# committed blind anchor (results/rgb/ablation/walker/nesy_blind), which is the same
# config run through the same ablation harness.
#
# READ THIS ARM CAREFULLY -- "SHARING ALONE, SHORTCUT INTACT".
# META_DECISION_INTERVAL stays at its default of 1 here, so the meta-Q still
# re-picks a skill EVERY step and can compensate for a blind actor by itself.
# That shortcut is exactly what META_DECISION_INTERVAL: 4 removes in the Tier-0
# and Tier-1a arms. Therefore:
#   SEES  -> sharing cures blindness even with the meta shortcut available:
#            a strong result.
#   BLIND -> this is NOT evidence against sharing. It means removing the meta
#            shortcut is NECESSARY for sharing to bite, and the Tier-1a arm
#            (MDI=4) is the one that answers the hypothesis.
#
# INTEGRITY: no aux loss is configured here, so train/rgb/aux_state_loss must be
# EXACTLY 0 for the whole run.
ALG_NAME: nexus_ac_pqn
ENV_NAME: WalkerWalk
PLAYGROUND_IMPL: jax
POLICY: walker_walk
META_POLICY_TYPE: nesy

# --- lever A alone, on the blind anchor ---
# walker_walk_nesy.yaml is the pure-state config: it declares no RGB keys and
# rgb_pixel_ablation.py forces USE_RGB: True (this is how the committed
# walker/nesy_blind arm was produced). RGB_SHARED_ENCODER is validated only
# when USE_RGB is on, so it must be set alongside it here.
USE_RGB: true
RGB_SHARED_ENCODER: true       # one CNN trunk, N small action heads
RGB_MONITOR_SENSITIVITY: true  # log train/rgb/pixel_sensitivity every update
TOTAL_TIMESTEPS: 52428800  # 400 updates (2048x64); raised from ~38 for adequate training / fair within-env comparison
NUM_ENVS: 2048
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
NUM_SEEDS: 1
SEED: 0
GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80
LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0
ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu
NOISE_START: 0.35
NOISE_FINISH: 0.03
NOISE_DECAY: 0.80
META_EPS_START: 1.0
META_EPS_FINISH: 0.02
META_EPS_DECAY: 0.60
NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.0005
ACTOR_UPDATE_MODE: all_states
PRINT_EVERY: 0
SAVE_PATH: null
