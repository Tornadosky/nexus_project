ALG_NAME: nexus_ac_pqn
ENV_NAME: HopperHop
PLAYGROUND_IMPL: jax
POLICY: hopper_hop
META_POLICY_TYPE: nesy
# 400 updates at 2048 envs x 64 steps. Hopper's standing*hopping reward is a
# hard discovery problem: at the old 5M-step budget outcomes were bimodal
# across seeds (1/3 learned). 400up + wide parallel reset discovery + slow
# exploration decay (below) learned on 3/3 seeds (runs/loop_fix/batchA,
# 2026-06-11: returns {141, 310, 130}, hop success {0.19, 0.39, 0.17}).
TOTAL_TIMESTEPS: 52428800
NUM_ENVS: 2048
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
NUM_SEEDS: 1
SEED: 0
GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80
LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0
ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu
# Sustained exploration (no actor-noise decay, higher floors): part of the
# 3/3-seed recipe above — early decay was what made seeds collapse into the
# never-stands regime.
NOISE_START: 0.35
NOISE_FINISH: 0.05
NOISE_DECAY: 1.0
META_EPS_START: 1.0
META_EPS_FINISH: 0.05
META_EPS_DECAY: 0.60
NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.0005
ACTOR_UPDATE_MODE: all_states
PRINT_EVERY: 0
SAVE_PATH: null
