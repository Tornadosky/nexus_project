ALG_NAME: nexus_ac_pqn
ENV_NAME: PandaPickCube
PLAYGROUND_IMPL: jax
POLICY: panda_pick_cube
META_POLICY_TYPE: nesy
# 400 updates at 1024 envs x 64 steps. Holding the cube on the table pays a
# steady env-reward income, so the meta can converge into a no-lift trap
# (and MORE budget alone deepens it: stock 400up seeds gave lift {0.02,
# 0.34}, bimodal). Validated 2026-06-11 (runs/loop_fix/batchC): with the
# sustained meta-exploration below, lift success was {0.109, 0.172} on the
# two probe seeds (incl. the previously-trapped seed 0) with nonzero place
# success. Gate panda on lift_success/height delta, never on return (the
# trap pays MORE return than lifting).
TOTAL_TIMESTEPS: 26214400
NUM_ENVS: 1024
NUM_STEPS: 64
NUM_EPOCHS: 4
NUM_MINIBATCHES: 64
NUM_SEEDS: 1
SEED: 0
GAMMA: 0.99
LAMBDA: 0.65
SKILL_LAMBDA: 0.65
META_LAMBDA: 0.80
LR: 0.0003
LR_START: 0.0003
LR_END: 0.00005
LR_DECAY: 1.0
ANNEAL_LR: true
MAX_GRAD_NORM: 1.0
ACTOR_HIDDEN_SIZES: [256, 256]
CRITIC_HIDDEN_SIZES: [256, 256]
META_HIDDEN_SIZES: [128, 128]
NUM_CRITICS: 2
NORM_TYPE: layer_norm
ACTIVATION: relu
NOISE_START: 0.25
NOISE_FINISH: 0.02
NOISE_DECAY: 0.80
# Sustained meta-exploration (no decay, 5% floor): keeps re-sampling the
# masked-allowed lift skill so the meta cannot fully deconverge into the
# table-income trap. Part of the validated recipe above.
META_EPS_START: 1.0
META_EPS_FINISH: 0.05
META_EPS_DECAY: 1.0
NORMALIZE_OBS: true
NORMALIZE_REWARD: false
BEHAVIOR_PENALTY_COEFF: 0.001
ACTOR_UPDATE_MODE: all_states
PRINT_EVERY: 0
SAVE_PATH: null
