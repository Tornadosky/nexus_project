[project]
name = "nexus-continuous-control"
version = "0.1.0"
description = "Continuous-control NEXUS / hierarchical Actor-Critic PQN extension for MuJoCo Playground."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Generated for NEXUS continuous-control deliverables"}]
dependencies = [
  "jax>=0.4.30,<0.5",
  "flax>=0.8.4,<0.9",
  "optax>=0.2.3,<0.3",
  "numpy>=1.24,<2",
  "pyyaml>=6.0",
  "chex>=0.1.86,<0.1.90",
  "orbax-checkpoint>=0.6.4,<0.7",
  "wandb>=0.17.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0"
]

[project.optional-dependencies]
playground = [
  "playground @ git+https://github.com/google-deepmind/mujoco_playground.git"
]
vision = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5.0"]
analysis = ["matplotlib>=3.8", "pandas>=2.0"]

[project.scripts]
nexus-playground-train = "nexus_continuous.scripts.train_nexus_playground:main"
nexus-playground-train-flat = "nexus_continuous.scripts.train_flat_ac_pqn_playground:main"
nexus-playground-eval = "nexus_continuous.scripts.eval_policy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_continuous*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
